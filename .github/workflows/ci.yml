name: CI

# Builds the site the same way the deployment does, so a pull request fails
# here rather than after it has been published.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run Ruff
        run: uv run --locked --group dev ruff check .
      - name: Check formatting
        run: uv run --locked --group dev ruff format --check .

  docs:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The same flags the library repositories build their docs with, and the
      # same ones pages.yml publishes with: -n makes an unresolvable reference
      # a warning, -W makes every warning an error, and --keep-going lists all
      # of them instead of stopping at the first.
      - name: Build site
        run: >
          uv run --locked --group dev
          sphinx-build -n -W --keep-going -b html
          -d "${RUNNER_TEMP}/doctrees" docs/source docs/build
      - uses: actions/upload-artifact@v7
        with:
          name: site-html
          path: docs/build
