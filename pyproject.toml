# The organization's front page at https://pysnmp.github.io/, built with
# Sphinx -- the same generator, theme and flags the three library repositories
# use for their own documentation, so the four sites look and behave like one.
#
# Nothing is packaged or published from here. The layout, the lockfile, the
# ruff configuration and the commit conventions match pysnmp, pysmi and pyasn1
# so that editing the site is the same motion as editing their docs.
[project]
name = "pysnmp-site"
version = "0.0.0"
description = "The pysnmp organization site at https://pysnmp.github.io/"
license = "BSD-2-Clause"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.urls]
homepage = "https://pysnmp.github.io/"
repository = "https://github.com/pysnmp/pysnmp.github.io"

# PEP 735, and the same sphinx and myst-parser floors the library repositories
# pin, because the site shares their conf.py conventions.
[dependency-groups]
dev = [
    "sphinx >=9.1.0,<10.0.0",
    "furo >=2025.12.19",
    "myst-parser >=5.1.0,<6.0.0",
    "ruff >=0.4.0,<1.0.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs/build"]

[tool.ruff.lint]
# The rule set the library repositories share. There is one Python file here --
# docs/source/conf.py -- and it is held to the same standard as theirs.
select = [
    "E", "W", "F", "I", "UP", "B", "S", "SIM", "BLE", "G", "LOG",
    "FLY", "C4", "RSE", "RUF", "PL", "TRY", "D",
]
ignore = [
    "E501",     # line-too-long -- ruff format decides where lines break
    "SIM108",   # if-else-block-instead-of-if-exp -- readability preference
    "TRY003",   # raise-vanilla-args -- message text is part of the error
    "D401",     # non-imperative-mood
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# A Sphinx configuration file is a flat list of assignments Sphinx exec()s:
# there is nothing to document beyond the module docstring, and `copyright`
# shadowing a builtin is the name Sphinx reads.
"docs/source/conf.py" = ["A001", "D100"]
