[project]
name = "pysnmp-org-site"
version = "0.0.0"
description = "The pysnmp organisation landing page"
requires-python = ">=3.14"
license = "BSD-2-Clause"
dependencies = []

# Nothing here is published to PyPI: this repository builds one static site and
# carries the organisation's shared GitHub configuration. uv still needs a
# project table to hang the dependency group and the tool settings off, so the
# project is declared and left unbuildable -- there is no [build-system] and
# no package to install.

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "mypy>=1.14",
    "ruff>=0.8",
]

[tool.uv]
# `uv sync` on a project with no build backend would try to install the project
# itself and fail. The site is a script run out of the checkout, not a package.
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# The rule set pyasn1, pysmi and pysnmp share, so a contributor moving between
# the repositories meets the same lint. D1 on top of it, as in pysmi: this tree
# is small and new, so every public thing in it carries a docstring.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "BLE",    # flake8-blind-except
    "G",      # flake8-logging-format (keep logging interpolation lazy)
    "LOG",    # flake8-logging (logger misuse)
    "FLY",    # flynt (static str.join -> f-string)
    "C4",     # flake8-comprehensions
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific rules
    "PL",     # pylint
    "TRY",    # tryceratops
    "D1",     # pydocstyle: every public thing carries a docstring
]
ignore = [
    # Shared with pyasn1, pysmi and pysnmp.
    "E501",     # line-too-long -- ruff format decides where lines break
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR2004",  # magic-value-comparison
    "TRY003",   # raise-vanilla-args -- message text is part of the error contract
]

[tool.ruff.lint.isort]
known-first-party = ["www"]

[tool.mypy]
python_version = "3.14"
files = ["www"]
ignore_missing_imports = true
warn_unreachable = true
strict = true
